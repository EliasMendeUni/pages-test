[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pagestest"
version = "0.1.0"
description = "Small stand-in project to test the documentation workflow of TOSTADA"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    {name = "Elias Mende"},
]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

docs = [
    "sphinx>=9.1",
    "sphinx-autoapi>=3.8.1",
    "sphinx_design>=0.7",
    "furo>=2025.12",
    "myst-parser>=5.1",
    "myst-nb>=1.4",
]

all = ["pagestest[dev,docs]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
